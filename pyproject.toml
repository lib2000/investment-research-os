# Ruff and mypy ratchets for unattended verification.
# Modules absent from the mypy legacy list are checked with strict = true.
# BLE001 per-file ignores hold existing blind-except hits. E722 has no ignores.

[tool.ruff]
target-version = "py312"
extend-exclude = ["research_vault", "tessdata"]

[tool.ruff.lint]
select = ["E722", "BLE001"]

