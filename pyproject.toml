[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_server: test needs a running backend process and is excluded from python -m tools.verify",
    "network: test needs outbound network access and is excluded from python -m tools.verify",
]

[tool.importlinter]
root_packages = ["app", "research_os"]
include_external_packages = true

